[package]
name = "yangpa-daemon"
version.workspace = true
edition.workspace = true
# 후원 기능 폴더(supporter/)만 별도 라이선스(LICENSE-SUPPORTER.md).
license = "AGPL-3.0-or-later AND LicenseRef-YANGPA-Supporter"
rust-version.workspace = true
publish.workspace = true
# tests/*.rs를 따로 찾지 않습니다(아래 [[test]], tests/daemon.rs).
autotests = false

[dependencies]
yangpa-core.workspace = true
yangpa-crypto.workspace = true
yangpa-store.workspace = true
yangpa-sync.workspace = true
yangpa-net.workspace = true
yangpa-rpc.workspace = true
yangpa-sfu.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
sysinfo.workspace = true
clap.workspace = true
directories.workspace = true
keyring.workspace = true
blake3.workspace = true
zeroize.workspace = true
rand.workspace = true
sha2.workspace = true
qrcodegen.workspace = true
humantime.workspace = true
async-trait.workspace = true
base64.workspace = true
bs58.workspace = true
bytes.workspace = true
serde_bytes.workspace = true
url.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
httparse.workspace = true
image.workspace = true

# 데이터 경로 디스크의 여유 공간(블롭 저장 공간 정리, blobs/cache.rs), 데몬을 띄운 앱 프로세스 지켜보기(src/parent.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading",
] }

# keyring의 기본 저장소는 Android를 몰라 DB 키는 Android Keystore 저장소로 keyring-core를 바로 씁니다(identity.rs).
[target.'cfg(target_os = "android")'.dependencies]
keyring-core.workspace = true
android-native-keyring-store.workspace = true

[[bin]]
name = "yangpad"
path = "src/main.rs"

# 통합 시험은 tests/daemon.rs 하나로 묶어 한 번만 링크합니다(그 파일 머리말 참고).
[[test]]
name = "daemon"
path = "tests/daemon.rs"

# 성능 측정은 bench.yml이 perf 프로필로 따로 빌드·실행합니다.
[[test]]
name = "perf"
path = "tests/perf.rs"

[dev-dependencies]
tempfile.workspace = true
