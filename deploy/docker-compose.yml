# 양파 메신저(가칭) 헤드리스 시더 예시(NAS·VPS). 자세한 설명은 docs/headless.md.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec seeder yangpa status
#
# 데이터는 이름 붙은 볼륨(yangpa-data)에만 남습니다. 그 안에 DB 키 파일도 있으니 볼륨이 놓인 디스크를 암호화하세요.

name: yangpa

services:
  seeder:
    build:
      context: ..
      dockerfile: Dockerfile
    image: yangpa-seeder:local
    container_name: yangpa-seeder
    restart: unless-stopped
    # 데몬은 볼륨(/var/lib/yangpa)에만 씁니다. 루트 파일 시스템은 읽기 전용으로.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - yangpa-data:/var/lib/yangpa
    # 다른 노드가 들어올 포트. 공유기·방화벽에서도 같은 번호(TCP와 UDP)를 열어 주세요.
    # Tor로 띄울 때(아래 YANGPA_DIRECT 예)는 들어오는 포트가 필요 없으니 이 항목을 지워도 됩니다.
    ports:
      - "47810:47810/tcp"
      - "47810:47810/udp"
      # 통화 SFU 미디어(UDP). 큰 통화의 호스트를 맡지 않게 하려면 YANGPA_SFU_HOST: never로 두고 지워도 됩니다.
      - "47811:47811/udp"
    # IPv6·같은 네트워크 탐색이 필요하면 ports 대신 호스트 네트워크를 쓰고 command로 수신 주소를 바꾸세요.
    # network_mode: host
    environment:
      # 로그 수준(tracing 필터). 어떤 수준에서도 메시지 내용·키·토큰은 남지 않습니다.
      YANGPA_LOG: info
      # 통화 SFU 호스트(이미지 기본: prefer, UDP 47811). 브리지 네트워크에서는 컨테이너 IP만 알므로 참가자가 닿을
      # 공인 IP(또는 포트 포워딩한 공유기의 IP)를 알려 주세요. 쉼표로 여러 개.
      # YANGPA_SFU_ANNOUNCE: "203.0.113.7"
      # YANGPA_SFU_HOST: never
      # 이미지 기본은 직접 연결(YANGPA_DIRECT=1). Tor로 도는 앱 사용자와 닿게 하려면 Tor(onion)로 띄웁니다:
      # YANGPA_DIRECT: "0"
    # 기본 인자: --no-mdns --listen /ip4/0.0.0.0/tcp/47810 --listen /ip4/0.0.0.0/udp/47810/quic-v1
    # 바꿀 때는 전체를 다시 적습니다. 예) 공인 IP가 있는 VPS에서 크루의 릴레이 역할도:
    # command: ["--no-mdns", "--relay-server",
    #           "--listen", "/ip4/0.0.0.0/tcp/47810", "--listen", "/ip4/0.0.0.0/udp/47810/quic-v1"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      # 메모리 덤프에 키가 남지 않게(기획서 '크래시 덤프' 대응).
      core: 0
      # 휘발성 채널 키를 잠긴 메모리(mlock)에 둘 수 있게.
      memlock: 8388608
    # 종료 신호를 받으면 네트워크를 닫고 휘발성 상태를 지운 뒤 DB를 정리합니다.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yangpa-data:
