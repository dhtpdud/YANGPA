name: CI

# 문서·화면 사진만 바뀌면 돌지 않습니다. 아래 다시 넣은 문서는 시험이 읽으므로 돌립니다
# (crates/yangpa-cli/tests/doc_examples.rs, third_party의 include_str!). 뒤 줄이 앞 줄을 덮습니다.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!apps/desktop/screenshots/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/user-guide.md'
      - 'docs/headless.md'
      - 'third_party/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!apps/desktop/screenshots/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/user-guide.md'
      - 'docs/headless.md'
      - 'third_party/**'

# 빌드와 시험만 하니 저장소 읽기만 줍니다. 저장소 기본 토큰 권한이 넓게 설정돼 있어도 여기서 좁힙니다.
permissions:
  contents: read

# 같은 PR에 새로 올리면 이전 실행을 취소해 Actions 사용량을 아낍니다(비공개 저장소는 분 단위 과금).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # SQLCipher가 쓰는 OpenSSL(openssl-src)은 MSVC 빌드에 Windows용 perl이 필요합니다. Git bash 안에서는 MSYS perl이
  # 먼저 잡힐 수 있어 Strawberry Perl을 직접 가리킵니다(GitHub Windows 이미지와 PC 러너 모두 이 경로).
  OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
  # 시험 실행 파일 수십 개를 링크하는 시간이 길어, MSVC link.exe 대신 툴체인에 든 rust-lld(lld-link)를 씁니다.
  # 릴리스(release.yml, scripts/build-windows-release.sh)는 그대로 link.exe입니다.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

# 지금 대상은 Windows만입니다(docs/decisions.md). Actions는 Windows만 보고, 리눅스 검사(실제 창 연기 시험 포함)는
# 개발 환경에서 돌립니다. 저장소 변수 CI_RUNNERS=self-hosted면 GitHub 서버 대신 직접 등록한 PC 러너에서
# 돕니다(docs/self-hosted-runner.md).
jobs:
  rust:
    name: Rust (Windows)
    runs-on: ${{ vars.CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Windows","X64","yangpa"]') || 'windows-latest' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # GitHub 서버는 매번 새 머신이라 캐시를 받고 올립니다. PC 러너는 아래 단계의 빌드 폴더를 그대로 이어 쓰므로
      # 캐시를 내려받고 올리는 시간(수 GB)을 쓰지 않습니다.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: vars.CI_RUNNERS != 'self-hosted'
      # checkout이 지우지 않는 러너 도구 폴더에 빌드 폴더를 두어, 바뀐 크레이트만 다시 빌드합니다. 두 작업이 같은 PC에서
      # 차례로 돌아 이 폴더를 함께 씁니다. rustc가 바뀌면 옛 산출물이 쌓이기만 하므로 비웁니다.
      - name: PC 러너 빌드 폴더 이어 쓰기
        if: vars.CI_RUNNERS == 'self-hosted'
        run: |
          dir="$(cygpath -m "$RUNNER_TOOL_CACHE")/yangpa-target"
          stamp="$(rustc -V)"
          if [ -f "$dir/.rustc" ] && [ "$(cat "$dir/.rustc")" != "$stamp" ]; then
            rm -rf "$dir"
          fi
          mkdir -p "$dir"
          printf '%s' "$stamp" > "$dir/.rustc"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: 형식 검사
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # taiki-e/install-action은 PowerShell 7(pwsh)이 있어야 해서 PC 러너에서 못 돕니다. 판을 고정해 직접 깔고,
      # 같은 판이 이미 있으면(PC 러너의 CARGO_HOME) 건너뜁니다.
      - name: cargo-nextest 설치
        env:
          NEXTEST_VERSION: 0.9.148
        run: |
          # 출력 예: "cargo-nextest 0.9.148 (해시 날짜)"
          have="$(cargo nextest --version 2>/dev/null || true)"
          have="${have#cargo-nextest }"
          if [ "${have%% *}" != "$NEXTEST_VERSION" ]; then
            cargo install cargo-nextest --version "$NEXTEST_VERSION" --locked
          fi
      # 멈춘 시험은 하나씩 끊고(.config/nextest.toml) 나머지는 계속 돌립니다.
      - name: 테스트
        run: cargo nextest run --profile ci --no-fail-fast
      - name: 문서 예제 시험
        run: cargo test --doc

  desktop:
    name: 데스크톱 앱 (Windows)
    runs-on: ${{ vars.CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Windows","X64","yangpa"]') || 'windows-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # GitHub 서버는 매번 새 머신이라 캐시를 받고 올립니다. PC 러너는 아래 단계의 빌드 폴더를 그대로 이어 쓰므로
      # 캐시를 내려받고 올리는 시간(수 GB)을 쓰지 않습니다.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: vars.CI_RUNNERS != 'self-hosted'
      # checkout이 지우지 않는 러너 도구 폴더에 빌드 폴더를 두어, 바뀐 크레이트만 다시 빌드합니다. 두 작업이 같은 PC에서
      # 차례로 돌아 이 폴더를 함께 씁니다. rustc가 바뀌면 옛 산출물이 쌓이기만 하므로 비웁니다.
      - name: PC 러너 빌드 폴더 이어 쓰기
        if: vars.CI_RUNNERS == 'self-hosted'
        run: |
          dir="$(cygpath -m "$RUNNER_TOOL_CACHE")/yangpa-target"
          stamp="$(rustc -V)"
          if [ -f "$dir/.rustc" ] && [ "$(cat "$dir/.rustc")" != "$stamp" ]; then
            rm -rf "$dir"
          fi
          mkdir -p "$dir"
          printf '%s' "$stamp" > "$dir/.rustc"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      # npm 캐시도 GitHub 서버에서만 받습니다. PC 러너에서는 사용자의 npm 캐시(약 1GB)를 매번 내려받아 그 폴더에 풀어
      # 1분 넘게 걸렸고, 그 캐시는 이미 PC에 있습니다(npm ci --prefer-offline이 씀).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ vars.CI_RUNNERS != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: apps/desktop/package-lock.json
      # 종단 간 시험(src/e2e)이 실제 데몬 세 개를 띄웁니다(Windows는 named pipe). 없으면 건너뛰지 않고 실패하게 합니다.
      - name: 데몬 빌드(종단 간 시험용)
        run: cargo build -p yangpa-daemon
      - name: 프런트엔드 빌드·테스트(실제 데몬 종단 간 포함)
        working-directory: apps/desktop
        env:
          YANGPA_E2E_REQUIRED: '1'
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build
          npm test -- --run
      # clippy(--all-targets)와 test가 컴파일까지 확인하므로 따로 build하지 않습니다.
      - name: Tauri 쪽 검사
        run: |
          cargo clippy -p yangpa-desktop --all-targets -- -D warnings
          cargo test -p yangpa-desktop
      - name: 설치 훅 연결 확인(MSI·NSIS·deb)
        run: |
          # Windows의 python3는 스토어 바로가기일 수 있어 python을 먼저 찾습니다.
          py="$(command -v python || command -v python3)"
          "$py" -I scripts/check_installer_hooks.py selftest
          "$py" -I scripts/check_installer_hooks.py
