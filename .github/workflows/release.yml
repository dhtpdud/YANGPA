# 릴리스: `v*` 태그를 올리면 데몬·CLI·MCP 서버와 데스크톱 앱 묶음, 헤드리스 시더 이미지를 만들어
# SHA-256 체크섬과 함께 **초안** GitHub 릴리스에 올립니다. 사람이 확인한 뒤 공개합니다.
#
# 대상: 리눅스 x86_64·aarch64(deb·AppImage), Windows x86_64(msi·NSIS), macOS 유니버설(Apple 실리콘+Intel 한 dmg),
# 시더 Docker 이미지 linux/amd64·linux/arm64.
#
# 데스크톱 묶음은 데몬을 Tauri 사이드카로 싣습니다(apps/desktop/src-tauri/tauri.conf.json의
# `bundle.externalBin: ["binaries/yangpad"]`). 그래서 `tauri build` 전에 같은 타깃으로 빌드한 데몬을
# `apps/desktop/src-tauri/binaries/yangpad-<타깃 트리플>[.exe]`에 둡니다(그 디렉터리는 git이 무시). macOS 유니버설은
# 두 아키텍처로 빌드한 데몬을 lipo로 합쳐 `yangpad-universal-apple-darwin`으로 둡니다(Tauri 규약).
#
# 묶은 뒤 설치 파일을 실제로 설치·업데이트·제거해 봅니다(scripts/installer-smoke.{sh,ps1}): 데몬이 도는 채로 업데이트·
# 제거해도 설치 파일이 그 데몬을 끄는지(Windows MSI·NSIS 훅, deb 유지 스크립트), dmg·AppImage에 사이드카가 있는지.
#
# 코드 서명 비밀은 설정하지 않습니다. 서명하려면 아래 "선택: 코드 서명" 주석을 보고 저장소 비밀을 넣으세요.
# 수동 실행(workflow_dispatch)은 빌드·시험만 하고 릴리스는 만들지 않습니다(산출물은 실행 기록에서 받음).

name: 릴리스

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 같은 태그는 같은 도구로 빌드되게 판을 고정합니다(MSRV는 1.91, CI는 stable).
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "22"
  # MSI 조각 문법 검사에 쓰는 WiX v3 스키마(Tauri가 쓰는 WiX 3.14와 같은 태그). 내용이 바뀌면 받지 않습니다.
  WIX_XSD_URL: https://raw.githubusercontent.com/wixtoolset/wix3/wix3141rtm/src/tools/wix/Xsd/wix.xsd
  WIX_XSD_SHA256: 493e95b6bc199bc613dd9348bbd326956835ece16cae15f5cb9189d1833270a9

jobs:
  meta:
    name: 판 번호·묶음 계약 확인
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 판 번호 맞추기
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tauri_version="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version ?? ""')"
          npm_version="$(node -p 'require("./apps/desktop/package.json").version')"
          echo "작업 공간 ${version}, tauri.conf.json ${tauri_version:-(없음)}, package.json ${npm_version}"
          fail=0
          if [ -n "$tauri_version" ] && [ "$tauri_version" != "$version" ]; then
            echo "::error::tauri.conf.json 판(${tauri_version})이 Cargo.toml 작업 공간 판(${version})과 다릅니다"
            fail=1
          fi
          if [ "$npm_version" != "$version" ]; then
            echo "::error::apps/desktop/package.json 판(${npm_version})이 Cargo.toml 작업 공간 판(${version})과 다릅니다"
            fail=1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v${version}" ]; then
            echo "::error::태그(${REF_NAME})가 작업 공간 판 v${version}과 다릅니다"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
      - name: 사이드카 계약 확인
        run: |
          node -e '
            const c = require("./apps/desktop/src-tauri/tauri.conf.json");
            const bins = (c.bundle && c.bundle.externalBin) || [];
            if (!bins.includes("binaries/yangpad")) {
              console.error("::error::tauri.conf.json의 bundle.externalBin에 \"binaries/yangpad\"가 없습니다(데몬 사이드카 계약)");
              process.exit(1);
            }
          '
          # 릴리스가 넣는 사이드카 파일이 커밋되지 않게.
          git check-ignore -q apps/desktop/src-tauri/binaries/yangpad-x86_64-unknown-linux-gnu \
            || { echo "::error::apps/desktop/src-tauri/binaries/가 git 무시 목록에 없습니다"; exit 1; }
      # 설치 파일이 업데이트·제거 전에 실행 중인 사이드카를 끄는 훅(NSIS·MSI)과 deb 유지 스크립트. 훅이 빠지면 앱 창을
      # 닫아도 도는 데몬 때문에 업데이트가 실패하거나 옛 데몬이 남으므로, 연결과 문법을 긴 빌드보다 먼저 확인합니다.
      - name: 설치 훅 연결 확인
        run: |
          python3 -I scripts/check_installer_hooks.py selftest
          python3 -I scripts/check_installer_hooks.py
      - name: 검사 도구
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nsis libxml2-utils >/dev/null
      - name: NSIS 설치 훅 문법
        run: |
          hooks="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").bundle.windows.nsis.installerHooks')"
          # Tauri 템플릿(installer.nsi)과 같은 순서로 포함하고 같은 자리에서 훅을 부르는 최소 스크립트.
          cat > "$RUNNER_TEMP/hooks-check.nsi" <<EOF
          Unicode true
          !include LogicLib.nsh
          !include x64.nsh
          !include "Win\RestartManager.nsh"
          !include "$PWD/apps/desktop/src-tauri/$hooks"
          Name "YANGPA"
          OutFile "$RUNNER_TEMP/hooks-check.exe"
          RequestExecutionLevel user
          Section Install
            !insertmacro NSIS_HOOK_PREINSTALL
            WriteUninstaller "\$INSTDIR\uninstall.exe"
          SectionEnd
          Section Uninstall
            !insertmacro NSIS_HOOK_PREUNINSTALL
          SectionEnd
          EOF
          makensis -V2 -WX "$RUNNER_TEMP/hooks-check.nsi"
      - name: MSI 조각 문법(WiX v3 스키마)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/wix.xsd" "$WIX_XSD_URL"
          echo "$WIX_XSD_SHA256  $RUNNER_TEMP/wix.xsd" | sha256sum -c -
          # 스키마의 정규식 두 곳이 .NET 문법(\$)이라 libxml2가 못 읽으므로 같은 뜻(XSD에서 $는 특수 문자가 아님)으로 바꿉니다.
          sed 's/\\\$/$/g' "$RUNNER_TEMP/wix.xsd" > "$RUNNER_TEMP/wix-libxml2.xsd"
          node -p '(require("./apps/desktop/src-tauri/tauri.conf.json").bundle.windows.wix.fragmentPaths).join("\n")' |
            while IFS= read -r frag; do
              xmllint --noout --schema "$RUNNER_TEMP/wix-libxml2.xsd" "apps/desktop/src-tauri/$frag"
            done

  build:
    name: 빌드 (${{ matrix.name }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35에 맞춰 빌드해 오래된 배포판(데비안 12 기반 NAS 등)에서도 돌게 합니다.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          # ARM 리눅스(라즈베리 파이 OS, ARM NAS)도 같은 이유로 22.04 ARM 러너(glibc 2.35)에서 빌드합니다.
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: msi,nsis
          # Apple 실리콘·Intel을 한 묶음으로. 두 아키텍처를 차례로 빌드해 lipo로 합칩니다(arm64 러너에서 x86_64는 교차 빌드).
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RUST_TARGETS: ${{ matrix.rust_targets }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_targets }}
      # 릴리스는 캐시 없이 깨끗하게 빌드합니다(다른 실행이 남긴 빌드 산출물·npm 캐시를 섞지 않음).
      # setup-node의 `cache: npm`도 쓰지 않습니다: 태그 실행은 기본 가지의 CI가 같은 키로 저장한 캐시를 되살립니다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 웹뷰·묶음 도구 (리눅스)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      # 배포 바이너리에서 빌드 머신 경로를 지웁니다(리버스 엔지니어링 방지). 릴리스는 기호·디버그 정보를 빼지만,
      # panic 위치 같은 문자열에 레지스트리 크레이트의 절대 경로(사용자 이름·러너 내부 구조)가 남습니다.
      # --remap-path-prefix로 그 접두사를 중립 토큰으로 바꿉니다. 맞는 접두사가 없으면 아무 일도 없습니다(무해).
      - name: 빌드 머신 경로 지우기
        run: |
          remap=()
          [ -n "${USERPROFILE:-}" ] && remap+=("--remap-path-prefix=${USERPROFILE}=~")
          [ -n "${HOME:-}" ] && remap+=("--remap-path-prefix=${HOME}=~")
          cargo_home="${CARGO_HOME:-}"
          [ -z "$cargo_home" ] && [ -n "${USERPROFILE:-}" ] && cargo_home="${USERPROFILE}\\.cargo"
          [ -n "$cargo_home" ] && remap+=("--remap-path-prefix=${cargo_home}=cargo")
          if [ ${#remap[@]} -gt 0 ]; then
            echo "RUSTFLAGS=${remap[*]}${RUSTFLAGS:+ $RUSTFLAGS}" >> "$GITHUB_ENV"
          fi
      - name: Windows용 perl
        if: runner.os == 'Windows'
        # SQLCipher가 쓰는 OpenSSL(openssl-src)은 MSVC 빌드에 Windows용 perl이 필요합니다(Git bash의 MSYS perl은 실패).
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - name: 데몬·CLI·MCP 서버 빌드
        run: |
          IFS=',' read -ra triples <<< "$RUST_TARGETS"
          for t in "${triples[@]}"; do
            cargo build --release --locked --target "$t" \
              -p yangpa-daemon -p yangpa-cli -p yangpa-mcp \
              --bin yangpad --bin yangpa --bin yangpa-mcp
          done
          if [ "$TARGET" = universal-apple-darwin ]; then
            mkdir -p "target/$TARGET/release"
            for b in yangpad yangpa yangpa-mcp; do
              lipo -create "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b" \
                -output "target/$TARGET/release/$b"
              # -verify_arch는 입력 파일 뒤에 둡니다(앞에 두면 Xcode 26 lipo가 파일 이름을 아키텍처로 읽음).
              lipo "target/$TARGET/release/$b" -verify_arch arm64 x86_64
            done
          fi
      - name: 실행 확인
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          "target/$TARGET/release/yangpad$exe" --version
          "target/$TARGET/release/yangpa$exe" --version

      - name: 사이드카 자리에 데몬 두기
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/$TARGET/release/yangpad$exe" "apps/desktop/src-tauri/binaries/yangpad-$TARGET$exe"
          # 유니버설 묶음은 Tauri가 아키텍처마다 앱을 따로 빌드하므로 그 빌드가 찾는 아키텍처별 이름도 둡니다.
          if [ "$TARGET" = universal-apple-darwin ]; then
            IFS=',' read -ra triples <<< "$RUST_TARGETS"
            for t in "${triples[@]}"; do
              cp "target/$t/release/yangpad" "apps/desktop/src-tauri/binaries/yangpad-$t"
            done
          fi
          ls -l apps/desktop/src-tauri/binaries

      - name: 프런트엔드 의존성
        working-directory: apps/desktop
        run: npm ci

      # 선택: 코드 서명. 비밀을 넣지 않으면 서명하지 않은 묶음을 만듭니다(macOS는 임시(ad-hoc) 서명).
      #   macOS: APPLE_CERTIFICATE(base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #          공증은 APPLE_ID·APPLE_PASSWORD(앱 암호)·APPLE_TEAM_ID. 아래 단계의 env에 secrets.*로 넣고
      #          임시 서명 설정(MACOS_ADHOC_CONFIG)을 빼세요.
      #   Windows: 인증서를 러너 저장소에 들인 뒤 tauri.conf.json의 bundle.windows.certificateThumbprint 또는
      #          signCommand를 쓰세요(Tauri 문서 "Windows Code Signing").
      - name: 데스크톱 앱 묶기
        working-directory: apps/desktop
        env:
          BUNDLES: ${{ matrix.bundles }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          # 서명 인증서가 없을 때 Apple Silicon에서 실행되도록 임시 서명합니다.
          MACOS_ADHOC_CONFIG: '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
        run: |
          bundles="$BUNDLES"
          # MSI(WiX)는 숫자로만 된 판 번호를 요구하므로 시험판(예: 0.2.0-rc.1)은 NSIS만 만듭니다.
          if [ "$RUNNER_OS" = Windows ] && [ "$PRERELEASE" = true ]; then bundles="nsis"; fi
          args=(build --ci --target "$TARGET" --bundles "$bundles")
          # 후원 모듈은 AGPL이 아니라 두 라이선스와 7조 추가 조건(NOTICE.md)을 설치 폴더의 licenses에 함께 넣습니다.
          # Windows는 PC 빌드(scripts/build-windows-release.sh)와 같은 스크립트로 실행 파일 옆 models(신경망 코덱)·
          # ffmpeg(화면공유 인코더)·pt(브리지 lyrebird)도 넣습니다.
          if [ "$RUNNER_OS" = Windows ]; then
            resources="$(bash ../../scripts/stage-windows-extras.sh "$(cygpath -u "$RUNNER_TEMP")/extras-cache")"
          else
            mkdir -p src-tauri/licenses
            cp ../../LICENSE ../../NOTICE.md ../../LICENSE-SUPPORTER.md ../../TRADEMARK.md src-tauri/licenses/
            resources='["licenses/"]'
          fi
          echo "BUNDLE_RESOURCES=$resources" >> "$GITHUB_ENV"
          args+=(--config "{\"bundle\":{\"resources\":$resources}}")
          if [ "$RUNNER_OS" = macOS ]; then args+=(--config "$MACOS_ADHOC_CONFIG"); fi
          npm run tauri -- "${args[@]}" -- --locked
          echo "BUNDLES_BUILT=$bundles" >> "$GITHUB_ENV"

      # 메이저 업그레이드를 실제로 해 보려고, 방금 만든 MSI를 옆에 두고 같은 바이너리로 한 번 더 묶습니다(새 ProductCode,
      # 같은 UpgradeCode). 올리는 것은 두 번째 MSI입니다(내용은 같음).
      - name: 업그레이드 시험용 MSI 하나 더
        if: runner.os == 'Windows' && contains(env.BUNDLES_BUILT, 'msi')
        working-directory: apps/desktop
        run: |
          msi="$(find ../../target/"$TARGET"/release/bundle/msi -maxdepth 1 -name '*.msi' -print -quit)"
          test -n "$msi"
          cp "$msi" "$RUNNER_TEMP/upgrade-from.msi"
          npm run tauri -- bundle --ci --target "$TARGET" --bundles msi --config "{\"bundle\":{\"resources\":$BUNDLE_RESOURCES}}"

      - name: 설치 시험 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "target/$env:TARGET/release/bundle"
          $msi = Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          $argv = @{ Cli = (Resolve-Path "target/$env:TARGET/release/yangpa.exe").Path; Nsis = $nsis.FullName }
          if ($msi) {
            $argv.Msi = $msi.FullName
            $argv.UpgradeFromMsi = Join-Path $env:RUNNER_TEMP 'upgrade-from.msi'
          }
          ./scripts/installer-smoke.ps1 @argv
      - name: 설치 시험 (리눅스)
        if: runner.os == 'Linux'
        run: |
          bundle="target/$TARGET/release/bundle"
          deb="$(find "$bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          appimage="$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          bash scripts/installer-smoke.sh deb "$deb" "target/$TARGET/release/yangpa"
          bash scripts/installer-smoke.sh appimage "$appimage"
      - name: 묶음 확인 (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg="$(find "target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' ! -name 'rw.*' -print -quit)"
          bash scripts/installer-smoke.sh dmg "$dmg" arm64 x86_64

      - name: 올릴 파일 모으기
        run: |
          exe=""
          archive="tar.gz"
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; archive="zip"; fi
          mkdir -p dist
          # 데스크톱 묶음(deb·AppImage·msi·NSIS 설치 파일·dmg). dmg를 만들 때 남을 수 있는 쓰기용 임시 이미지(rw.*)는 뺍니다.
          bundle_dir="target/$TARGET/release/bundle"
          find "$bundle_dir" -maxdepth 2 -type f ! -name 'rw.*' \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::$bundle_dir에서 데스크톱 묶음을 찾지 못했습니다"
            exit 1
          fi
          # 명령줄 묶음: 데몬·CLI·MCP 서버와 헤드리스 문서(리눅스는 systemd 단위도). macOS는 유니버설 바이너리.
          name="yangpa-cli-$VERSION-$TARGET"
          stage="_stage/$name"
          mkdir -p "$stage/docs"
          for b in yangpad yangpa yangpa-mcp; do
            cp "target/$TARGET/release/$b$exe" "$stage/"
          done
          cp README.md SECURITY.md "$stage/"
          cp docs/headless.md docs/user-guide.md "$stage/docs/"
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p "$stage/deploy"
            cp -R deploy/systemd "$stage/deploy/"
          fi
          if [ "$archive" = zip ]; then
            (cd _stage && 7z a -tzip "../dist/$name.zip" "$name" >/dev/null)
          else
            tar -C _stage -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: 헤드리스 시더 이미지 (${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          # 에뮬레이션(QEMU) 없이 ARM 러너에서 그대로 빌드합니다. 이미지 안은 데비안이라 러너 판과 상관없음.
          - arch: arm64
            os: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 이미지 빌드
        run: |
          docker build --pull \
            --build-arg "RUST_VERSION=$RUST_TOOLCHAIN" \
            --build-arg "VERSION=$VERSION" \
            --tag "yangpa-seeder:$VERSION" .
          test "$(docker image inspect -f '{{.Architecture}}' "yangpa-seeder:$VERSION")" = "$ARCH"
      - name: 연기 시험(비루트·상태 확인·정상 종료)
        run: |
          docker volume create yangpa-smoke >/dev/null
          # deploy/docker-compose.yml과 같은 제한으로 띄웁니다.
          docker run -d --name seeder --read-only --tmpfs /tmp:size=16m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges:true --ulimit core=0 --ulimit memlock=8388608 \
            -v yangpa-smoke:/var/lib/yangpa "yangpa-seeder:$VERSION"
          # 상태 확인(HEALTHCHECK)이 결론을 낼 때까지 기다립니다(최대 3분).
          status=starting
          for _ in $(seq 1 90); do
            status="$(docker inspect -f '{{.State.Health.Status}}' seeder)"
            if [ "$status" != starting ]; then break; fi
            sleep 2
          done
          docker logs seeder
          if [ "$status" != healthy ]; then
            echo "::error::컨테이너 상태 확인 결과: $status"
            exit 1
          fi
          test "$(docker exec seeder id -u)" = 10001
          test "$(docker exec seeder stat -c %a /var/lib/yangpa)" = 700
          docker exec seeder yangpa status
          docker exec seeder yangpa token list
          docker stop --time 30 seeder
          code="$(docker inspect -f '{{.State.ExitCode}}' seeder)"
          if [ "$code" != 0 ]; then
            echo "::error::데몬이 정상 종료하지 않았습니다(종료 코드 $code)"
            exit 1
          fi
      - name: 이미지 내보내기
        run: |
          mkdir -p dist
          docker save "yangpa-seeder:$VERSION" | gzip -9 > "dist/yangpa-seeder-$VERSION-linux-$ARCH.tar.gz"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-docker-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 초안 릴리스
    needs: [meta, build, docker]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 초안 릴리스를 만들고 파일을 올림(gh release)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA-256 체크섬
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - name: 릴리스 노트
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          YANGPA @VERSION@

          ## 파일

          | 파일 | 내용 |
          | --- | --- |
          | `YANGPA_*_amd64.deb`, `YANGPA_*_amd64.AppImage` | 리눅스 x86_64 데스크톱 앱(glibc 2.35 이상) |
          | `YANGPA_*_arm64.deb`, `YANGPA_*_aarch64.AppImage` | 리눅스 ARM64 데스크톱 앱(glibc 2.35 이상) |
          | `YANGPA_*_x64-setup.exe`(권장), `YANGPA_*_x64_en-US.msi` | Windows x86_64 데스크톱 앱 |
          | `YANGPA_*_universal.dmg` | macOS 데스크톱 앱(Apple 실리콘·Intel 공용) |
          | `yangpa-cli-@VERSION@-<타깃>` (`.tar.gz`, `.zip`) | 데몬 `yangpad`, CLI `yangpa`, MCP 서버 `yangpa-mcp`, 헤드리스 문서(리눅스는 systemd 단위). 타깃: `x86_64-unknown-linux-gnu`, `aarch64-unknown-linux-gnu`, `x86_64-pc-windows-msvc`, `universal-apple-darwin` |
          | `yangpa-seeder-@VERSION@-linux-amd64.tar.gz`, `…-linux-arm64.tar.gz` | 헤드리스 시더 Docker 이미지(`docker load < 파일`) |
          | `SHA256SUMS.txt` | 위 파일 전부의 SHA-256 |

          데스크톱 앱에는 데몬(`yangpad`)이 함께 들어 있습니다. 설치 파일(Windows `-setup.exe`·`.msi`, 리눅스 `.deb`)은
          업데이트·제거할 때 그 설치본의 데몬이 돌고 있으면 먼저 끕니다.

          ## 확인

          받은 파일과 같은 디렉터리에서 `sha256sum -c SHA256SUMS.txt --ignore-missing`(macOS는 `shasum -a 256 -c`)로 확인하세요.

          ## 알아 둘 점

          - 코드 서명을 하지 않은 묶음입니다. macOS는 임시(ad-hoc) 서명만 되어 있어 처음 열 때 "시스템 설정 → 개인정보 보호 및 보안"에서 열기를 허용해야 하고, Windows는 SmartScreen 경고가 뜹니다.
          - 사용법은 묶음 안의 `docs/user-guide.md`, 헤드리스 시더는 `docs/headless.md`를 보세요.
          - 라이선스는 AGPL-3.0-or-later이고, 후원 기능 모듈만 `LICENSE-SUPPORTER.md`를 따릅니다.
          EOF
          sed -i "s/@VERSION@/$VERSION/g" notes.md
      - name: 초안 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 다시 실행할 때는 초안에만 덮어씁니다(이미 공개한 릴리스의 파일은 바꾸지 않음).
            draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$draft" != true ]; then
              echo "::error::$TAG 릴리스가 이미 공개돼 있어 파일을 바꾸지 않습니다"
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            args=(--draft --verify-tag --title "YANGPA $TAG" --notes-file notes.md)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}" dist/*
          fi
